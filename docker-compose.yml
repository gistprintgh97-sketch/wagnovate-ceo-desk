services:
  db:
    image: postgres:16-alpine
    container_name: wagnovate-ceo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: wagnovate
      POSTGRES_PASSWORD: wagnovate_dev_password
      POSTGRES_DB: ceo_desk
    ports:
      - "5433:5432"
    volumes:
      - ceo_desk_pgdata:/var/lib/postgresql/data
volumes:
  ceo_desk_pgdata:
